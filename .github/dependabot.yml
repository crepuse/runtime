version: 2

updates:
    - package-ecosystem: "npm"
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "08:00"
          timezone: "Asia/Shanghai"
      open-pull-requests-limit: 5
      groups:
          development:
              dependency-type: "development"
              update-types:
                  - "minor"
                  - "patch"

    - package-ecosystem: "github-actions"
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "08:00"
          timezone: "Asia/Shanghai"
      open-pull-requests-limit: 5
